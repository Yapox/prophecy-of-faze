
name: Check FaZe Match Results

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faze-market-automation
  cancel-in-progress: false

jobs:
  check-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check results and apply enabled settlements
        env:
          PANDASCORE_API_TOKEN: ${{ secrets.PANDASCORE_API_TOKEN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PANDASCORE_AUDIT: 'true'
          ENABLED: ${{ vars.PANDASCORE_SETTLEMENT_ENABLED }}
        shell: bash
        run: |
          if [ "$ENABLED" = "true" ]; then
            node scripts/settle-pandascore-markets.cjs --apply
          else
            node scripts/settle-pandascore-markets.cjs --dry-run
          fi
