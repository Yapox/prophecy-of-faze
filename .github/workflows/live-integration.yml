name: Test Deployed Account Integration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faze-live-integration
  cancel-in-progress: false
jobs:
  test-account:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Test public website with a temporary confirmed QA account
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          PANDASCORE_API_TOKEN: ${{ secrets.PANDASCORE_API_TOKEN }}
          PUBLIC_SITE_URL: https://yapox.github.io/prophecy-of-faze/
        run: node scripts/check-live-integration.mjs
      - name: Upload non-secret verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-integration-report
          path: artifacts/live-integration/report.json
          if-no-files-found: ignore
